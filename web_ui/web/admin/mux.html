								<option data-multiplo="25" value="576i50">PAL</option>

								<option data-multiplo="30" value="1080i5994">HD 1080i 59.94</option>     
							</select>
						</div>
					</div>
				</div>

			<div class="clearfix"></div>	
			
			<input type="hidden" name="ts_package_size" value="188">
			<input type="hidden" name="card_number" value="0">

					</div>
				</div>
			</div>

					</div>
				</div>

								<option value="COMPOSITE">Video compuesto</option>
								 <option value="COMPONENT">Video por componentes</option>
								 <option value="S-VIDEO">Super Video</option>
							</select>
						</div>
					</div>
				</div>

			<input type="hidden" name="oneseg_av_offset" value="">

				<button type="button" class="btn btn-danger" id="guardar-reiniciar">Guardar y Reiniciar</button>

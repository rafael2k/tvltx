        <div id="page-wrapper">

            <div class="container-fluid">



                <!-- Page Heading -->
                <div class="row">
                    <div class="col-lg-12">
                        <ol class="breadcrumb">
                            <li>
                                <i class="fa fa-cogs"></i>  <a href="app.html">Ginga</a>
                            </li>
                            <li class="active">
                                <i class="fa fa-file"></i> Subir aplicación
                            </li>
                        </ol>
                    </div>
                </div>
                <!-- /.row -->
		<div>


		<form action="/upload/app" method="POST"  enctype="multipart/form-data" role="form" id="app-upload">
			<legend>Subir la aplicación comprimida</legend>
		
			<div class="col-sm-6">
				<div class="form-group">
					<div class="row">
						<div class="col-sm-12">
							<label for="video_pid">Archivo (zip o tar.gz)</label>
						</div>
						<div class="col-sm-12">
						<input type="file" name="upload" class="form-control">
						</div>
					</div>
				</div>
			</div>


			<div class="col-sm-6">
				<div class="form-group">
					<div class="row">
						<div class="col-sm-12">
							<label for="pcr_pid">Nombre del archivo NCL principal</label>
						</div>
						<div class="col-sm-12">
							<input type="text" name="ncl" class="form-control">	
						</div>
					</div>
				</div>
			</div>


			<div class="clearfix"></div>

			
<div class="col-sm-6">
                <div class="form-group">
                    <div class="row">
                        <div class="col-sm-12">
                            <label for="pcr_pid">Nombre de la aplicacion (sin espacios ni caracteres especiales)</label>
                        </div>
                        <div class="col-sm-12">
                            <input type="text" name="nombre" class="form-control"> 
                        </div>
                    </div>
                </div>
            </div>

			<div class="col-sm-12">
				<button type="submit" class="btn btn-primary">Guardar</button>
				<button type="button" class="btn btn-danger" id="guardar-reiniciar">Guardar y Reiniciar</button>
			</div>
		    </form>
		</div>

				<!-- <div id="configform"></div> -->
